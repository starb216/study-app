<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Studymint cute mint mascot logo">
  <defs>
    <linearGradient id="leafGradient" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#5FD8A3"/>
      <stop offset="100%" stop-color="#3CB583"/>
    </linearGradient>
  </defs>

  <!-- Mint leaf body -->
  <path d="M50 12
           C 62 8, 78 18, 82 34
           C 86 50, 74 68, 50 88
           C 26 68, 14 50, 18 34
           C 22 18, 38 8, 50 12 Z"
        fill="url(#leafGradient)"/>

  <!-- Central leaf vein -->
  <path d="M50 22 Q 52 52 50 82" stroke="#2A9D6A" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Left side veins -->
  <path d="M50 36 Q 40 42 34 48" stroke="#2A9D6A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M50 54 Q 40 60 34 66" stroke="#2A9D6A" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Right side veins -->
  <path d="M50 36 Q 60 42 66 48" stroke="#2A9D6A" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M50 54 Q 60 60 66 66" stroke="#2A9D6A" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- Cute round glasses frame -->
  <g stroke="#2A9D6A" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="40" cy="42" r="8"/>
    <circle cx="60" cy="42" r="8"/>
    <path d="M48 42 L52 42"/>
  </g>

  <!-- Eyes behind glasses -->
  <circle cx="40" cy="42" r="3" fill="#1A5E40"/>
  <circle cx="60" cy="42" r="3" fill="#1A5E40"/>

  <!-- Cheeks -->
  <ellipse cx="32" cy="52" rx="4" ry="2.5" fill="#B8F2D8" opacity="0.9"/>
  <ellipse cx="68" cy="52" rx="4" ry="2.5" fill="#B8F2D8" opacity="0.9"/>

  <!-- Friendly smile -->
  <path d="M42 56 Q 50 62 58 56" stroke="#1A5E40" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Small mint sprout on top -->
  <path d="M50 14 Q 44 6 38 10 Q 44 14 50 14" fill="#B8F2D8"/>
  <path d="M50 14 Q 56 6 62 10 Q 56 14 50 14" fill="#B8F2D8"/>
</svg>
