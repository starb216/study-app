<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fresh mint rounded-square badge -->
  <rect x="2" y="2" width="96" height="96" rx="24" fill="#5FD8A3"/>

  <!-- Deeper mint inner circle for depth -->
  <circle cx="50" cy="50" r="38" fill="#3CB583"/>

  <!-- Soft highlight suggesting a mint leaf / calm glow -->
  <circle cx="32" cy="32" r="14" fill="#B8F2D8" opacity="0.45"/>

  <!-- S + M monogram in white, constructed from clean vector strokes -->
  <path d="M 22 28 C 44 28, 44 42, 33 42 C 22 42, 22 56, 44 56"
        stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" fill="none"/>
  <path d="M 54 56 L 54 32 L 64 44 L 74 32 L 84 44 L 84 56"
        stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
