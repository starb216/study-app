<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Timer body -->
  <circle cx="50" cy="55" r="35" fill="#B8F2D8" stroke="#3CB583" stroke-width="4"/>

  <!-- Timer rim highlight -->
  <circle cx="50" cy="55" r="31" fill="none" stroke="#5FD8A3" stroke-width="2" opacity="0.6"/>

  <!-- Leaf button / stem on top -->
  <path d="M50 12 C50 12, 38 18, 38 30 C38 38, 45 42, 50 42 C55 42, 62 38, 62 30 C62 18, 50 12, 50 12 Z" fill="#5FD8A3" stroke="#2A9D6A" stroke-width="3"/>
  <path d="M50 20 Q50 34, 50 42" fill="none" stroke="#2A9D6A" stroke-width="2" stroke-linecap="round"/>

  <!-- Clock marks -->
  <g stroke="#2A9D6A" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="24" x2="50" y2="29"/>
    <line x1="50" y1="81" x2="50" y2="86"/>
    <line x1="19" y1="55" x2="24" y2="55"/>
    <line x1="76" y1="55" x2="81" y2="55"/>
  </g>

  <!-- Clock hands shaped like a subtle leaf / timer hands -->
  <line x1="50" y1="55" x2="50" y2="36" stroke="#2A9D6A" stroke-width="4" stroke-linecap="round"/>
  <line x1="50" y1="55" x2="64" y2="65" stroke="#2A9D6A" stroke-width="4" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="50" cy="55" r="4" fill="#3CB583"/>
</svg>
