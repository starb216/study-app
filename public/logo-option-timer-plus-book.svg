<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Studymint logo">
  <defs>
    <linearGradient id="mintGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5FD8A3" />
      <stop offset="100%" stop-color="#3CB583" />
    </linearGradient>
  </defs>

  <!-- Timer outer ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#mintGradient)" stroke-width="6" />

  <!-- Timer tick marks -->
  <g stroke="#B8F2D8" stroke-width="3" stroke-linecap="round">
    <line x1="50" y1="12" x2="50" y2="18" />
    <line x1="50" y1="82" x2="50" y2="88" />
    <line x1="12" y1="50" x2="18" y2="50" />
    <line x1="82" y1="50" x2="88" y2="50" />
  </g>

  <!-- Timer top button -->
  <rect x="45" y="4" width="10" height="8" rx="2" fill="#2A9D6A" />

  <!-- Open book shape -->
  <path d="M30 42 C30 38 38 36 50 40 C62 36 70 38 70 42 V66 C70 62 62 60 50 64 C38 60 30 62 30 66 Z" fill="#2A9D6A" />
  <path d="M50 40 V64" stroke="#B8F2D8" stroke-width="2" stroke-linecap="round" />

  <!-- Clock hands -->
  <g stroke="#5FD8A3" stroke-width="4" stroke-linecap="round">
    <line x1="50" y1="50" x2="50" y2="32" />
    <line x1="50" y1="50" x2="62" y2="50" />
  </g>

  <!-- Center pivot -->
  <circle cx="50" cy="50" r="4" fill="#3CB583" />
</svg>